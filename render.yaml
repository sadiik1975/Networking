services:
  - type: web
    name: been-ventures
    runtime: python
    # Free plan sleeps after ~15 min idle; ping /health every 5 min to keep it warm.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DISPATCH_API_KEY
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      - key: TAVILY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
