services:
  - type: web
    name: networking-connector
    runtime: python
    # Free plan sleeps after ~15 min idle; ping /health every 5 min to keep it warm.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      # Optional: a free external Postgres URL keeps data across redeploys.
      - key: DATABASE_URL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Optional: secret Telegram echoes on ask-bot webhook calls.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Optional: public base URL for webhook self-registration
      # (Render sets RENDER_EXTERNAL_URL automatically when unset).
      - key: PUBLIC_BASE_URL
        sync: false
